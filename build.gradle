plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}-neoforge" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
        exclude '.cache/**', '**/*.bbmodel'
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    ivy {
        name = 'DestroyForkReleases'
        url = 'https://github.com/NHblock714/Destroy/releases/download'
        patternLayout { artifact 'v[revision]/[artifact]-1.21.1-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeGroup 'io.github.NHblock714' }
    }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"

    compileOnly "io.github.NHblock714:destroy:${destroy_version}"
    compileOnly "maven.modrinth:petrolpark:${petrolpark_version_id}"
    compileOnly "maven.modrinth:sable:${sable_version_id}"
    if (providers.gradleProperty('destroyEnabled').getOrElse('false').toBoolean()) {
        localRuntime "io.github.NHblock714:destroy:${destroy_version}"
        localRuntime "maven.modrinth:petrolpark:${petrolpark_version_id}"
    }
    if (providers.gradleProperty('aeronauticsEnabled').getOrElse('false').toBoolean()) {
        localRuntime "maven.modrinth:create-aeronautics:${aeronautics_version_id}"
        localRuntime "maven.modrinth:sable:${sable_version_id}"
    }
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    if (providers.gradleProperty('jeiEnabled').getOrElse('true').toBoolean()) {
        localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    }
}

neoForge {
    version = neo_version
    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.INFO
        }
        client { client(); gameDirectory = file('run/client1') }
        client2 {
            client()
            gameDirectory = file('run/client2')
            programArguments.addAll '--username', 'Dev2', '--uuid', '00000000-0000-0000-0000-000000000009'
        }
        destroyClient { client(); gameDirectory = file('run/phase25/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
        data {
            data()
            gameDirectory = file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath, '--existing-mod', 'create'
        }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replacements = [
            minecraft_version_range: minecraft_version_range, neo_version: neo_version,
            loader_version_range: loader_version_range, mod_id: mod_id, mod_name: mod_name,
            mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
            mod_description: mod_description, create_version_range: create_version_range,
            destroy_version_range: destroy_version_range
    ]
    inputs.properties replacements
    expand replacements
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_id', mod_id
    filesMatching('pack.mcmeta') { expand mod_id: mod_id }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll '-Xlint:deprecation', '-Xmaxerrs', '1000'
}
tasks.named('wrapper', Wrapper) { distributionType = Wrapper.DistributionType.BIN }
publishing { publications { register('mavenJava', MavenPublication) { from components.java } } }
idea { module { downloadSources = true; downloadJavadoc = true } }

apply from: 'src/test/game-tests.gradle'
