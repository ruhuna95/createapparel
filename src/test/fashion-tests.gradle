sourceSets {
    fashionTest {
        java.setSrcDirs(['src/test/fashion/java'])
        resources.setSrcDirs(['src/test/fashion/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

if (providers.gradleProperty('fashionLint').getOrElse('false').toBoolean()) {
    tasks.named('compileJava', JavaCompile) { options.compilerArgs.add('-Xlint:deprecation') }
}

neoForge.runs {
    fashionTestClient {
        client()
        gameDirectory = file('run/fashion-tests/client')
        systemProperty 'forge.logging.console.level', 'info'
        systemProperty 'apparel.fashionTest.client', 'true'
        systemProperty 'apparel.fashionTest.projectDir', projectDir.absolutePath
        systemProperty 'apparel.generateAdvertisementIcons', providers.gradleProperty('generateAdvertisementIcons').getOrElse('false')
        sourceSet = sourceSets.fashionTest
    }
}

tasks.matching { it.name == 'runFashionTestClient' }.configureEach {
    doLast {
        def log = file('run/fashion-tests/client/logs/latest.log')
        if (!log.exists() || !log.getText('UTF-8').contains('FASHION_CLIENT_QA_SUCCESS')) {
            throw new GradleException('Fashion client checks did not report success; inspect run/fashion-tests/client/logs/latest.log')
        }
    }
}
