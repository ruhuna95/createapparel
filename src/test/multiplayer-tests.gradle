sourceSets {
    multiplayerTest {
        java.setSrcDirs(['src/test/multiplayer/java'])
        resources.setSrcDirs(['src/test/multiplayer/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

def multiplayerRunId = providers.gradleProperty('multiplayerRunId').getOrElse('local')
if (!(multiplayerRunId ==~ /[A-Za-z0-9_-]+/)) throw new GradleException('Invalid multiplayerRunId')
def multiplayerRoot = file("run/multiplayer-tests/${multiplayerRunId}")
def multiplayerResume = providers.gradleProperty('multiplayerResume').getOrElse('false')
def multiplayerPort = providers.gradleProperty('multiplayerPort').getOrElse('25585')
if (!(multiplayerPort ==~ /\d{4,5}/)) throw new GradleException('Invalid multiplayerPort')

neoForge.runs {
    serverMultiplayerTest {
        server(); programArgument '--nogui'
        gameDirectory = new File(multiplayerRoot, 'server')
        systemProperty 'forge.logging.console.level', 'info'
        systemProperty 'apparel.multiplayer.server', 'true'
        systemProperty 'apparel.multiplayer.root', multiplayerRoot.absolutePath
        systemProperty 'apparel.multiplayer.resume', multiplayerResume
        sourceSet = sourceSets.multiplayerTest
    }
    ['A', 'B'].each { role ->
        "clientMultiplayerTest${role}" {
            client()
            gameDirectory = new File(multiplayerRoot, "client-${role}")
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'apparel.multiplayer.role', role
            systemProperty 'apparel.multiplayer.root', multiplayerRoot.absolutePath
            systemProperty 'apparel.multiplayer.resume', multiplayerResume
            systemProperty 'apparel.multiplayer.address', "127.0.0.1:${multiplayerPort}"
            programArguments.addAll '--username', "ApparelQA${role}", '--quickPlayMultiplayer', "127.0.0.1:${multiplayerPort}", '--width', '640', '--height', '480'
            sourceSet = sourceSets.multiplayerTest
        }
    }
}

tasks.register('prepareMultiplayerTestWorld') {
    doLast {
        def directory = new File(multiplayerRoot, 'server')
        directory.mkdirs()
        new File(directory, 'server.properties').setText("""server-ip=127.0.0.1
server-port=${multiplayerPort}
online-mode=false
enforce-secure-profile=false
level-type=minecraft:flat
generator-settings={"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":2}],"biome":"minecraft:plains"}
generate-structures=false
level-seed=0
view-distance=2
simulation-distance=2
spawn-protection=0
max-tick-time=0
""", 'UTF-8')
    }
}
tasks.matching { it.name == 'prepareServerMultiplayerTestRun' }.configureEach { dependsOn 'prepareMultiplayerTestWorld' }
tasks.matching { it.name in ['runServerMultiplayerTest', 'runClientMultiplayerTestA', 'runClientMultiplayerTestB'] }.configureEach {
    doLast {
        def phase = multiplayerResume.toBoolean() ? 'resume' : 'initial'
        def role = name == 'runServerMultiplayerTest' ? 'server' : name.takeRight(1)
        def result = new File(multiplayerRoot, "${phase}-${role}-passed.txt")
        if (!result.isFile()) throw new GradleException("Multiplayer checks did not pass: ${result}")
    }
}

tasks.register('exportMultiplayerTestLaunches') {
    dependsOn 'multiplayerTestClasses', 'prepareServerMultiplayerTestRun', 'prepareClientMultiplayerTestARun', 'prepareClientMultiplayerTestBRun'
    doLast {
        def launches = ['Server', 'ClientA', 'ClientB'].collect { role ->
            def taskName = role == 'Server' ? 'runServerMultiplayerTest' : "runClientMultiplayerTest${role.takeRight(1)}"
            def launch = tasks.named(taskName, JavaExec).get()
            def preparation = tasks.named(role == 'Server' ? 'prepareServerMultiplayerTestRun' : "prepareClientMultiplayerTest${role.takeRight(1)}Run").get()
            def directory = launch.gameDirectory.get().asFile
            directory.mkdirs()
            def snapshot = file("build/multiplayer-${multiplayerRunId}/${role}")
            snapshot.mkdirs()
            def vmArgs = new File(snapshot, 'vm.args')
            def programArgs = new File(snapshot, 'program.args')
            vmArgs.setText(preparation.vmArgsFile.get().asFile.getText('UTF-8'), 'UTF-8')
            programArgs.setText(preparation.programArgsFile.get().asFile.getText('UTF-8'), 'UTF-8')
            def jvmArgs = launch.allJvmArgs.collect { argument -> argument.startsWith('@') ? '@' + vmArgs.absolutePath : argument }
            def command = [launch.javaLauncher.get().executablePath.asFile.absolutePath] +
                    jvmArgs + ['-cp', files(launch.classpath, launch.classpathProvider).asPath, launch.mainClass.get(), '@' + programArgs.absolutePath]
            [role: role, directory: directory.absolutePath, command: command,
             environment: (launch.environment + launch.environmentProperty.get()).findAll { key, value -> !key.contains('=') }
                     .collectEntries { key, value -> [key, value.toString()] }]
        }
        def output = file("build/multiplayer-${multiplayerRunId}.json")
        output.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(launches)), 'UTF-8')
    }
}
