sourceSets {
    escalatedClientTest {
        java.setSrcDirs(['src/test/route/client/java'])
        resources.setSrcDirs(['src/test/route/client/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

if (providers.gradleProperty('escalatedTests').getOrElse('false').toBoolean()) {
    dependencies {
        routeTestRuntimeOnly 'maven.modrinth:escalated:vJ49zRJl'
        escalatedClientTestRuntimeOnly 'maven.modrinth:escalated:vJ49zRJl'
    }
    neoForge.runs.routeTestServer.systemProperty 'apparel.escalatedTests', 'true'
}

neoForge.runs {
    escalatedClient {
        client()
        gameDirectory = file('run/escalated-client')
        systemProperty 'forge.logging.console.level', 'info'
        systemProperty 'apparel.escalatedClient', 'true'
        sourceSet = sourceSets.escalatedClientTest
    }
}

tasks.matching { it.name == 'runEscalatedClient' }.configureEach {
    doFirst {
        if (!providers.gradleProperty('escalatedTests').getOrElse('false').toBoolean())
            throw new GradleException('Use -PescalatedTests=true to load Escalated in the manual client.')
    }
}
