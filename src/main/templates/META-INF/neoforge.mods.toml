modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="createapparel.apparel.mixins.json"
[[mixins]]
config="createapparel.mixins.json"
[[mixins]]
config="createapparel.photo.mixins.json"
[[mixins]]
config="createapparel.retail.mixins.json"
[[mixins]]
config="createapparel.destroy.mixins.json"
[[mixins]]
config="createapparel.destroy_jei.mixins.json"
[[mixins]]
config="createapparel.jei.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="create"
type="required"
versionRange="${create_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="destroy"
type="optional"
versionRange="${destroy_version_range}"
ordering="AFTER"
side="BOTH"
